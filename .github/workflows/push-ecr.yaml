# This GitHub Actions workflow automates pushing the tx-tool Docker image to Amazon ECR Public.
# It triggers on any new tag or manual dispatch, builds a Docker image, and pushes it to Amazon Elastic Container Registry (ECR) Public.
name: Push to Amazon ECR

on:
  push:
    tags:
      - '*' # Triggers the workflow on any new tag
  workflow_dispatch:
    inputs:
      image_tag_version:
        description: 'Version to tag the Docker image'
        required: true
        type: string
      ecr_repository:
        description: 'ECR Public repository name including alias (e.g. j7v0v6n9/tx-tool)'
        required: false
        type: string

permissions:
  id-token: write # OIDC token for aws-actions/configure-aws-credentials
  contents: read

env:
  # ECR Public API only exists in us-east-1.
  AWS_REGION: us-east-1
  # <alias>/<repo> from the same vars as run-tx-tool.yaml; the input overrides both.
  ECR_REPOSITORY: ${{ inputs.ecr_repository || format('{0}/{1}', vars.ECR_REGISTRY_ALIAS || 'j7v0v6n9', vars.ECR_REPOSITORY || 'tx-tool') }}
  DOCKERFILE_PATH: ${{ vars.DOCKERFILE_PATH || 'Dockerfile' }}

jobs:
  push-to-ecr:
    name: Push to ECR
    runs-on: ubuntu-latest
    environment: dev-swaps

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Get Git tags and set image tags
        id: vars
        run: |
          git fetch --tags
          
          # Get exact match tag if it exists (will be empty if the current commit doesn't have a tag)
          GIT_TAG=$(git describe --exact-match --tags 2>/dev/null || echo "")
          
          # Set environment variables and echo results
          if [ -n "$GIT_TAG" ]; then
            echo "GIT_TAG=$GIT_TAG" >> $GITHUB_ENV
            echo "Git Tag Discovery:"
            echo "  Found exact match Git tag: $GIT_TAG"
          else
            echo "Git Tag Discovery:"
            echo "  No exact match Git tag found for current commit"
          fi
          
          # Set the input IMAGE_TAG_VERSION
          echo "IMAGE_TAG_VERSION=${{ github.event.inputs.image_tag_version }}" >> $GITHUB_ENV
          echo "  User-provided IMAGE_TAG_VERSION: ${{ github.event.inputs.image_tag_version }}"

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # Swaps images never take latest; main's scheduled run pulls it.
          IMAGE_TAG_LATEST: ''
        run: |
          # Get Git information for build args
          GIT_COMMIT=$(git rev-parse HEAD)
          GIT_TAG_BUILD=$(git describe --exact-match --tags 2>/dev/null || echo "none")
          
          echo "Git information for build:"
          echo "  Commit: $GIT_COMMIT"
          echo "  Tag: $GIT_TAG_BUILD"
          
          # Build docker container with multiple tags
          DOCKER_BUILD_ARGS=()
          if [ -n "$IMAGE_TAG_LATEST" ]; then
            DOCKER_BUILD_ARGS+=("-t" "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_LATEST")
          fi
          
          # Only add IMAGE_TAG_VERSION if it's not empty
          if [ -n "$IMAGE_TAG_VERSION" ]; then
            DOCKER_BUILD_ARGS+=("-t" "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_VERSION")
          fi
          
          # Add exact tag if it exists
          if [ -n "$GIT_TAG" ]; then
            DOCKER_BUILD_ARGS+=("-t" "$ECR_REGISTRY/$ECR_REPOSITORY:$GIT_TAG")
          fi
          
          # Echo final tags that will be pushed
          echo "Docker Image Tags to be pushed:"
          for arg in "${DOCKER_BUILD_ARGS[@]}"; do
            if [[ "$arg" != "-t" ]]; then
              echo "  $arg"
            fi
          done
          echo ""
          
          # Build with all tags and Git build args
          echo "Building Docker image..."
          docker build "${DOCKER_BUILD_ARGS[@]}" \
            --build-arg GIT_COMMIT="$GIT_COMMIT" \
            --build-arg GIT_TAG="$GIT_TAG_BUILD" \
            -f $DOCKERFILE_PATH .
          
          # Push all tags with error handling
          for tag in "$IMAGE_TAG_LATEST" "$IMAGE_TAG_VERSION" "$GIT_TAG"; do
            # Skip empty tags (e.g., if IMAGE_TAG_VERSION or GIT_TAG is unset)
            [ -z "$tag" ] && continue
            image="$ECR_REGISTRY/$ECR_REPOSITORY:$tag"
            echo "Pushing $image…"
            if ! docker push "$image"; then
              echo "Failed to push $image"
              exit 1
            fi
          done
          
          # Output the image URIs
          if [ -n "$IMAGE_TAG_LATEST" ]; then
            echo "image_latest=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_LATEST" >> $GITHUB_OUTPUT
          fi
          
          if [ -n "$IMAGE_TAG_VERSION" ]; then
            echo "image_version=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG_VERSION" >> $GITHUB_OUTPUT
          fi
          
          if [ -n "$GIT_TAG" ]; then
            echo "image_exact_tag=$ECR_REGISTRY/$ECR_REPOSITORY:$GIT_TAG" >> $GITHUB_OUTPUT
          fi
          
          echo ""
          echo "====================================="
          echo "Successfully pushed to ECR:"
          echo "  Registry:   $ECR_REGISTRY"
          echo "  Repository: $ECR_REPOSITORY"
          echo "  Tags:       $IMAGE_TAG_LATEST ${IMAGE_TAG_VERSION:+$IMAGE_TAG_VERSION }${GIT_TAG:+$GIT_TAG}"
          echo "====================================="
